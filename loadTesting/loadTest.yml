config:
  target: 'https://oddsapi.winx777.com'  # Target base URL
  phases:
    - duration: 300          # 300 seconds = 5 minutes
      arrivalRate: 5000      # 5000 requests per second
  defaults:
    headers:
      User-Agent: "artillery-load-test"  # Custom user-agent header
scenarios:
  - flow:
      - get:
          url: "/v2/api/oddsData?market_id=1.229691932"


