#
# Nginx DDoS Protection Configuration
#
# Copy this file to /etc/nginx/conf.d/ddos-protection.conf
# Then run: sudo nginx -t && sudo nginx -s reload
#
# This config works WITH the Node.js DDoS protection middleware.
# Nginx handles L4/connection-level protection, Node.js handles L7/application-level.
#

# --- Rate Limiting Zones ---
# Define rate limiting zones (place in http block or include in nginx.conf)

# Global rate limit: 10 requests/second per IP
limit_req_zone $binary_remote_addr zone=global_rate:10m rate=10r/s;

# API rate limit: 5 requests/second per IP for API endpoints
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=5r/s;

# Login rate limit: 1 request/second per IP for auth endpoints
limit_req_zone $binary_remote_addr zone=login_rate:5m rate=1r/s;

# --- Connection Limiting ---
# Max 20 simultaneous connections per IP
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# --- Blocked IPs ---
# This file is auto-updated by the Node.js ddosProtection middleware
# and the nginx-ip-blocker.sh script
include /etc/nginx/conf.d/blocked-ips.conf;

